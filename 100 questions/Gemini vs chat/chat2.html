<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Three.js Particle Sandbox</title>
  <style>
    body { margin: 0; overflow: hidden; background: #000; }
    #info {
      position: fixed;
      top: 10px;
      left: 10px;
      color: #00ffcc;
      font-family: monospace;
      font-size: 14px;
    }
  </style>
</head>
<body>
<div id="info">Three.js Particle Sandbox<br>Move mouse to interact</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js"></script>
<script>
/******************** BASIC SETUP ********************/
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x000000, 50, 300);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.z = 120;

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

/******************** PARTICLES ********************/
const COUNT = 10000;
const geometry = new THREE.BufferGeometry();
const positions = new Float32Array(COUNT * 3);
const colors = new Float32Array(COUNT * 3);

const color = new THREE.Color();

for (let i = 0; i < COUNT; i++) {
  const x = (Math.random() - 0.5) * 200;
  const y = (Math.random() - 0.5) * 200;
  const z = (Math.random() - 0.5) * 200;

  positions[i * 3] = x;
  positions[i * 3 + 1] = y;
  positions[i * 3 + 2] = z;

  color.setHSL(Math.random(), 1.0, 0.6);
  colors[i * 3] = color.r;
  colors[i * 3 + 1] = color.g;
  colors[i * 3 + 2] = color.b;
}

geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

const material = new THREE.PointsMaterial({
  size: 1.0,
  vertexColors: true,
  transparent: true,
  opacity: 0.9
});

const particles = new THREE.Points(geometry, material);
scene.add(particles);

/******************** MOUSE INTERACTION ********************/
const mouse = new THREE.Vector3();

window.addEventListener('mousemove', (e) => {
  mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
  mouse.z = 0;
});

/******************** ANIMATION LOOP ********************/
function animate() {
  requestAnimationFrame(animate);

  const pos = geometry.attributes.position.array;

  for (let i = 0; i < COUNT; i++) {
    const i3 = i * 3;
    const dx = pos[i3] - mouse.x * 80;
    const dy = pos[i3 + 1] - mouse.y * 80;
    const dz = pos[i3 + 2];

    const dist = Math.sqrt(dx * dx + dy * dy + dz * dz);

    if (dist < 20) {
      pos[i3] += dx * 0.02;
      pos[i3 + 1] += dy * 0.02;
    }
  }

  geometry.attributes.position.needsUpdate = true;

  particles.rotation.y += 0.0008;
  renderer.render(scene, camera);
}

animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
