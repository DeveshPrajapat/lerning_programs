<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Gesture‑Controlled City Particle System</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body { margin: 0; overflow: hidden; background: #000; }
    #info {
      position: absolute; top: 10px; left: 10px; color: #fff;
      font-family: sans-serif; font-size: 14px; opacity: 0.8;
    }
    video { display: none; }
  </style>
</head>
<body>
<div id="info">
  ✋ Open palm → expand city<br>
  ✊ Fist → contract particles<br>
  ☝ Index finger → switch template<br>
</div>
<video id="video" autoplay playsinline></video>

<!-- Three.js -->
<script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js"></script>

<!-- MediaPipe Hands -->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

<script>
/***********************
 * THREE.JS SETUP
 ***********************/
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x000000, 50, 300);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(0, 40, 120);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

const clock = new THREE.Clock();

/***********************
 * CITY PARTICLE SYSTEM
 ***********************/
let particleCount = 12000;
let geometry = new THREE.BufferGeometry();
let positions = new Float32Array(particleCount * 3);
let colors = new Float32Array(particleCount * 3);

const color = new THREE.Color();

function generateCity() {
  for (let i = 0; i < particleCount; i++) {
    const x = (Math.random() - 0.5) * 200;
    const z = (Math.random() - 0.5) * 200;
    const y = Math.random() * Math.random() * 60;

    positions[i * 3] = x;
    positions[i * 3 + 1] = y;
    positions[i * 3 + 2] = z;

    color.setHSL(0.55, 1.0, y / 80 + 0.2);
    colors[i * 3] = color.r;
    colors[i * 3 + 1] = color.g;
    colors[i * 3 + 2] = color.b;
  }
}

generateCity();

geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

const material = new THREE.PointsMaterial({
  size: 0.8,
  vertexColors: true,
  transparent: true,
  opacity: 0.85,
});

let particles = new THREE.Points(geometry, material);
scene.add(particles);

/***********************
 * PARTICLE TEMPLATES
 ***********************/
let templateIndex = 0;

function applyTemplate(type) {
  for (let i = 0; i < particleCount; i++) {
    let x, y, z;

    if (type === 0) {
      // HEART
      const t = Math.random() * Math.PI * 2;
      x = 16 * Math.pow(Math.sin(t), 3);
      y = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
      z = (Math.random() - 0.5) * 20;
    }
    else if (type === 1) {
      // FLOWER
      const t = Math.random() * Math.PI * 2;
      const r = Math.sin(5 * t) * 20;
      x = Math.cos(t) * r;
      y = Math.sin(t) * r;
      z = (Math.random() - 0.5) * 20;
    }
    else {
      // SPACE FIREWORK
      const t = Math.random() * Math.PI * 2;
      const p = Math.acos(2 * Math.random() - 1);
      const r = Math.random() * 30;
      x = r * Math.sin(p) * Math.cos(t);
      y = r * Math.sin(p) * Math.sin(t);
      z = r * Math.cos(p);
    }

    positions[i * 3] = x;
    positions[i * 3 + 1] = y + 30;
    positions[i * 3 + 2] = z;
  }

  geometry.attributes.position.needsUpdate = true;
}

/***********************
 * HAND TRACKING
 ***********************/
const videoElement = document.getElementById('video');

const hands = new Hands({
  locateFile: file => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
});

hands.setOptions({
  maxNumHands: 1,
  modelComplexity: 1,
  minDetectionConfidence: 0.7,
  minTrackingConfidence: 0.7
});

hands.onResults(onHandResults);

const cameraFeed = new Camera(videoElement, {
  onFrame: async () => {
    await hands.send({ image: videoElement });
  },
  width: 640,
  height: 480
});

cameraFeed.start();

let expansionTarget = 1;

function onHandResults(results) {
  if (!results.multiHandLandmarks) return;

  const landmarks = results.multiHandLandmarks[0];

  const thumb = landmarks[4];
  const index = landmarks[8];
  const middle = landmarks[12];

  const pinchDist = Math.hypot(index.x - thumb.x, index.y - thumb.y);

  // OPEN PALM → EXPAND
  if (pinchDist > 0.15) {
    expansionTarget = 1.5;
  }

  // FIST → CONTRACT
  if (pinchDist < 0.05) {
    expansionTarget = 0.6;
  }

  // INDEX UP → SWITCH TEMPLATE
  if (index.y < middle.y) {
    templateIndex = (templateIndex + 1) % 3;
    applyTemplate(templateIndex);
  }
}

/***********************
 * ANIMATION LOOP
 ***********************/
function animate() {
  requestAnimationFrame(animate);

  const delta = clock.getDelta();

  particles.scale.lerp(new THREE.Vector3(expansionTarget, expansionTarget, expansionTarget), delta);
  particles.rotation.y += delta * 0.1;

  renderer.render(scene, camera);
}

animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
